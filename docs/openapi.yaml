openapi: 3.0.3
info:
  title: Laravel Base API
  version: 1.0.0
  description: |
    OpenAPI specification for Laravel backend (API v1).
    All endpoints are prefixed with `/api/v1`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Password
  - name: Profile
  - name: Users
  - name: Roles & Permissions
  - name: Files
paths:
  /health:
    get:
      tags: [Health]
      summary: Combined health check
      responses:
        '200':
          description: OK or degraded (still HTTP 200)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: App process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
        '503':
          description: Dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /login:
    post:
      tags: [Auth]
      summary: Login by email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /login/google:
    post:
      tags: [Auth]
      summary: Login/register with Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLoginSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /logout:
    post:
      tags: [Auth]
      summary: Logout current user (revoke user tokens)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /refresh:
    post:
      tags: [Auth]
      summary: Refresh token pair
      description: Requires `refresh_token` in Bearer token header.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /me:
    get:
      tags: [Auth]
      summary: Get authenticated user context
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /password/forgot:
    post:
      tags: [Password]
      summary: Send password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordSuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /password/reset:
    post:
      tags: [Password]
      summary: Reset password by token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordSuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /password/change:
    post:
      tags: [Password]
      summary: Change current password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile:
    get:
      tags: [Profile]
      summary: Get own profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags: [Profile]
      summary: Update own profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /profile/avatar:
    post:
      tags: [Profile]
      summary: Upload own avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Profile]
      summary: Delete own avatar
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Avatar deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users:
    get:
      tags: [Users]
      summary: List users (paginated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersIndexSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [Users]
      summary: Create user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/{id}:
    get:
      tags: [Users]
      summary: Get user detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Users]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Delete user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeletedSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /users/{id}/avatar:
    post:
      tags: [Users]
      summary: Upload user avatar
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Delete user avatar
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Avatar deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /roles-permissions/roles:
    get:
      tags: [Roles & Permissions]
      summary: List roles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roles list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesListSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /roles-permissions/permissions:
    get:
      tags: [Roles & Permissions]
      summary: List permissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permissions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsListSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /roles-permissions/assign-role:
    post:
      tags: [Roles & Permissions]
      summary: Assign role to user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '200':
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleUserMutationSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /roles-permissions/remove-role:
    post:
      tags: [Roles & Permissions]
      summary: Remove role from user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '200':
          description: Role removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleUserMutationSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /roles-permissions/sync-roles:
    post:
      tags: [Roles & Permissions]
      summary: Sync user roles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRolesRequest'
      responses:
        '200':
          description: Roles synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleUserMutationSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /roles-permissions/give-permission:
    post:
      tags: [Roles & Permissions]
      summary: Assign permission to user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GivePermissionRequest'
      responses:
        '200':
          description: Permission assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleUserMutationSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /roles-permissions/revoke-permission:
    post:
      tags: [Roles & Permissions]
      summary: Revoke permission from user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GivePermissionRequest'
      responses:
        '200':
          description: Permission revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleUserMutationSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /files/upload:
    post:
      tags: [Files]
      summary: Upload single file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFileRequest'
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /files/upload-multiple:
    post:
      tags: [Files]
      summary: Upload multiple files
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadMultipleFilesRequest'
      responses:
        '201':
          description: Files uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadMultipleSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /files/download:
    get:
      tags: [Files]
      summary: Download file
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Disk'
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: File binary stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /files:
    delete:
      tags: [Files]
      summary: Delete file
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Disk'
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: File deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDeleteSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /files/list:
    get:
      tags: [Files]
      summary: List files in folder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Disk'
        - $ref: '#/components/parameters/Folder'
        - $ref: '#/components/parameters/Recursive'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Files listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /files/stats:
    get:
      tags: [Files]
      summary: File statistics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Disk'
        - $ref: '#/components/parameters/Folder'
        - $ref: '#/components/parameters/Recursive'
      responses:
        '200':
          description: File statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileStatsSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    UserIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    Search:
      name: search
      in: query
      schema:
        type: string
    Disk:
      name: disk
      in: query
      schema:
        type: string
        enum: [public, private]
    FilePath:
      name: path
      in: query
      required: true
      schema:
        type: string
        maxLength: 1024
    Folder:
      name: folder
      in: query
      schema:
        type: string
        maxLength: 255
    Recursive:
      name: recursive
      in: query
      schema:
        type: boolean
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ApiMeta:
      type: object
      properties:
        request_id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        current_page:
          type: integer
          nullable: true
        per_page:
          type: integer
          nullable: true
        total:
          type: integer
          nullable: true
        last_page:
          type: integer
          nullable: true
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true
      additionalProperties: true
    SuccessEnvelope:
      type: object
      required: [success, message, meta]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        meta:
          $ref: '#/components/schemas/ApiMeta'
        data:
          nullable: true
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
        links:
          type: object
          additionalProperties:
            type: string
            nullable: true
    ErrorEnvelope:
      type: object
      required: [success, message, meta]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: object
          nullable: true
          additionalProperties: true

    ResponseMeta:
      type: object
      required: [request_id, timestamp]
      properties:
        request_id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        status_code:
          type: integer
          nullable: true

    PaginationMeta:
      allOf:
        - $ref: '#/components/schemas/ResponseMeta'
        - type: object
          required: [current_page, per_page, total, last_page]
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer
            from:
              type: integer
              nullable: true
            to:
              type: integer
              nullable: true

    PaginationLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    HealthCheckItem:
      type: object
      required: [ok, duration_ms]
      properties:
        ok:
          type: boolean
        message:
          type: string
          nullable: true
        duration_ms:
          type: integer

    HealthChecks:
      type: object
      required: [db, redis]
      properties:
        db:
          $ref: '#/components/schemas/HealthCheckItem'
        redis:
          $ref: '#/components/schemas/HealthCheckItem'

    HealthResponseData:
      type: object
      required: [overall_status, timestamp, checks]
      properties:
        overall_status:
          type: string
          enum: [ok, degraded]
        timestamp:
